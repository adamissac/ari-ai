# train_balanced (train split). Reward coefficients are fixed across all configs (protocol 17).
env_version: DefenseSimEnv-v0
horizon: 200
nodes:
- name: gateway
  criticality: 0.3
  exposed: true
  finding_severity: 0.3
- name: api
  criticality: 0.5
  exposed: true
  finding_severity: 0.5
- name: auth
  criticality: 0.7
  exposed: false
  finding_severity: 0.2
- name: payments
  criticality: 0.9
  exposed: false
  finding_severity: 0.6
- name: db
  criticality: 1.0
  exposed: false
  finding_severity: 0.1
edges:
- - gateway
  - api
- - api
  - auth
- - api
  - payments
- - auth
  - db
- - payments
  - db
adversary:
  entry_prob: 0.03
  lateral_prob: 0.04
  escalate_prob: 0.04
  impact_prob: 0.03
  severity_weight: 1.0
signals:
  benign_alert_rate: 1.0
  stage_alert_rate: 1.5
  monitoring_gain: 0.5
  anomaly_noise: 0.05
  benign_burst_prob: 0.02
defense:
  rate_limit_factor: 0.3
  isolate_clean_prob: 0.3
  effect_duration: 10
  monitoring_duration: 20
  max_monitoring_level: 2
  reassessment_delay: 15
  reassessment_severity_after: 0.1
  escalation_delay: 5
  escalation_success_prob: 0.8
  max_escalations: 3
reward:
  c_impact: 1.0
  c_progress: 2.0
  c_disrupt: 0.3
  c_action: 0.02
  c_escalate: 0.5
  c_contain: 1.0
  c_terminal: 20.0
  c_invalid: 0.1
name: train_balanced
split: train
