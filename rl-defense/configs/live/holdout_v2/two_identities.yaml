# Held-out v2 (created 2026-10-19, after the v1 holdout was exposed; never evaluated
# before the final v2 run). Two compromised tenants take turns, one per window, so
# blocking only the identity just seen leaves the other one open.
name: two_identities
split: holdout
horizon: 30
schedule: bursty
p_start: 0.25
p_stop: 0.25
attack_per_step: 5
benign_per_step: 8
attackers: [bob, carol]
attacker_switch: per_window
victims: [alice]
benign: [alice, bob, carol]
seed_start: 45000
episodes: 30
