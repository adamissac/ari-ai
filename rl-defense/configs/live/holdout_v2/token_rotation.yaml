# Held-out v2 (created 2026-10-19; see two_identities.yaml). One tenant cycles through
# three valid tokens, one per window, and targets two other tenants. A token-keyed block
# would miss it; the principal-keyed block should not.
name: token_rotation
split: holdout
horizon: 30
schedule: bursty
p_start: 0.2
p_stop: 0.3
attack_per_step: 6
benign_per_step: 6
attackers: [bob]
rotate_tokens: true
victims: [alice, carol]
benign: [alice, bob, carol]
seed_start: 46000
episodes: 30
