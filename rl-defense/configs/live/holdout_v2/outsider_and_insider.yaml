# Held-out v2 (created 2026-10-19; see two_identities.yaml). An attacker-only tenant
# (no legitimate traffic, rotating tokens) and a compromised customer interleave
# requests within each window, under heavier benign load.
name: outsider_and_insider
split: holdout
horizon: 30
schedule: bursty
p_start: 0.3
p_stop: 0.25
attack_per_step: 4
benign_per_step: 10
attackers: [mallory, bob]
attacker_switch: per_request
rotate_tokens: true
victims: [alice, carol]
benign: [alice, bob, carol]
seed_start: 47000
episodes: 30
