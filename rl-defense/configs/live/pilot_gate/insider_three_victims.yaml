# Pilot gate (created 2026-11-14, committed before any policy was evaluated on it; see
# results/pilot-gate/PREREGISTRATION.md). A paying customer (dave) who is also alice's
# bookkeeper reads bob's, carol's and erin's payments in medium bursts while his delegated
# reads continue. Unseen: a delegate attacking three non-delegating victims.
name: pilot_insider_three_victims
split: holdout
horizon: 30
schedule: bursty
p_start: 0.22
p_stop: 0.3
attack_per_step: 5
benign_per_step: 7
attackers: [dave]
victims: [bob, carol, erin]
benign: [alice, bob, carol, dave]
delegations: ["dave:alice", "erin:carol"]
delegate_per_step: 2
delegate_burst_p: 0.3
delegate_burst_size: 4
seed_start: 41600
episodes: 30
