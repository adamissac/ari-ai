# Held-out v3 (created 2026-10-19, before any policy was evaluated on it; see
# results/live-retrain-v3/PROVENANCE.md). Three attacking identities take turns per window,
# rotating tokens, while two bookkeepers legitimately read their clients' payments.
# Unseen: three identities, rotation combined with switching, and two delegates at once.
name: three_identities_delegated
split: holdout
horizon: 30
schedule: bursty
p_start: 0.25
p_stop: 0.2
attack_per_step: 5
benign_per_step: 8
attackers: [bob, carol, mallory]
attacker_switch: per_window
rotate_tokens: true
victims: [alice]
benign: [alice, bob, carol, dave, erin]
delegations: ["dave:alice", "erin:carol"]
delegate_per_step: 1
delegate_burst_p: 0.2
delegate_burst_size: 3
seed_start: 48000
episodes: 30
