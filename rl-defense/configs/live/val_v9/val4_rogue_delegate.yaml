# Val v4 (created 2026-10-19, before the v4 run). dave is authorized for alice but also
# reads carol's and erin's payments, interleaved per request with a token-rotating outsider.
name: val4_rogue_delegate
split: val
horizon: 30
schedule: bursty
p_start: 0.3
p_stop: 0.4
attack_per_step: 5
benign_per_step: 7
attackers: [dave, mallory]
attacker_switch: per_request
rotate_tokens: true
victims: [carol, erin]
benign: [alice, carol, dave, erin]
delegations: ["dave:alice", "erin:carol"]
delegate_per_step: 1
seed_start: 22000
episodes: 15
