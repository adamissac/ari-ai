# Route -> simulator node mapping for the owned demo target examples/payments-lite
# (docs/20, planned DEMO-001). PROPOSAL: route templates must be confirmed against the
# real app once it exists (owner of examples/: coordinate via coordination/messages).
project: payments-lite
default_node: api
nodes:
  - node: gateway
    route_patterns: ["* /health*", "* /docs*", "* /openapi.json"]
    exposed: true
    criticality_floor: 0.3
  - node: api
    route_patterns: ["* /customers*", "* /me*"]
    exposed: true
    criticality_floor: 0.5
  - node: auth
    route_patterns: ["* /auth/*", "* /login*", "* /token*", "* /sessions*"]
    exposed: false
    criticality_floor: 0.7
  - node: payments
    route_patterns: ["* /payments*", "* /refunds*"]
    exposed: false
    criticality_floor: 0.9
  - node: db
    route_patterns: []
    exposed: false
    criticality_floor: 1.0
