[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-defense"
version = "0.1.0"
description = "Simulated cyber-defense environment and Double DQN policy (recommendations only)"
requires-python = ">=3.12"
dependencies = [
  "gymnasium>=1.0",
  "numpy>=1.26",
  "torch>=2.4",
  "pydantic>=2.7",
  "pyyaml>=6",
  "scipy>=1.13",
  "hackatl-shared",  # canonical contracts (../shared); install with `uv pip install -e ../shared`
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
hackatl-shared = { path = "../shared", editable = true }

[tool.setuptools.packages.find]
include = ["rl_defense*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: longer training smoke tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is enforced by `ruff format`; long strings are allowed
