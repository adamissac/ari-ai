# Local stack: PostgreSQL + migrations + API + worker. No paid services.
#   cp .env.example .env   # fill GITHUB_WEBHOOK_SECRET / SESSION_SECRET; ANTHROPIC_API_KEY optional
#   docker compose up --build
# Without Docker, use `make dev` (embedded PostgreSQL via pgserver).
# The sandbox driver (security-agents, Alan) is added here when it lands.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app-local-only
      POSTGRES_DB: hackatl
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d hackatl"]
      interval: 2s
      retries: 30

  migrate:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["hackatl-migrate"]
    env_file: [.env]
    environment: &dbenv
      DATABASE_URL: postgresql+psycopg://app:app-local-only@db:5432/hackatl
      # Overrides .env's host-relative default; the image user can only write the volume.
      ARTIFACT_STORE_URI: file:///data/artifacts
    depends_on: { db: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["hackatl-api"]
    env_file: [.env]
    environment: *dbenv
    ports: ["127.0.0.1:8000:8000"]
    volumes: [artifacts:/data/artifacts]
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      retries: 20

  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["hackatl-worker"]
    env_file: [.env]
    environment: *dbenv
    volumes: [artifacts:/data/artifacts]
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped

volumes:
  pgdata:
  artifacts:
