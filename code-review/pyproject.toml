[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hackatl-code-review"
version = "0.1.0"
description = "Pillar 1 reviewer/repair runtime agent: intent evidence, generated behavioral tests, isolated candidate repairs"
requires-python = ">=3.12"
dependencies = [
  "hackatl-standards",
  "hackatl-shared",
  "hackatl-backend",
  "pyyaml>=6",
]

[tool.uv.sources]
hackatl-standards = { workspace = true }
hackatl-shared = { workspace = true }
hackatl-backend = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["code_review"]

[tool.hatch.build.targets.wheel.force-include]
"code_review/prompts" = "code_review/prompts"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["shared.*", "backend.*", "code_intelligence.*", "security_agents.*"]
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["code_review._pytest_report"]
ignore_errors = true  # copied into the sandbox; stdlib-only hook module with pytest's untyped hooks
