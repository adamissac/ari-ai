[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hackatl-code-intelligence"
version = "0.1.0"
description = "Persistent SHA-pinned Python repository intelligence and bounded context retrieval"
requires-python = ">=3.12"
dependencies = ["hackatl-shared>=0.1.0", "pathspec>=0.12,<1", "tree-sitter>=0.25,<0.26", "tree-sitter-python>=0.25,<0.26"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1", "mypy>=1.15,<2"]
integration = ["hackatl-backend>=0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["code_intelligence"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["shared.*", "backend.*"]
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
