name: 36bd05ee exact-SHA independent check
on:
  push:
    branches: [codex/check-36bd05ee]
    paths: [.github/workflows/36bd05ee-independent.yml, docs/reviews/36bd05ee-independent/run.py, docs/reviews/36bd05ee-independent/test_additional.py, docs/reviews/36bd05ee-independent/pin.json]
permissions:
  contents: read
jobs:
  independent:
    strategy:
      fail-fast: false
      matrix:
        mode: [candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: m-alan08/ari-ai
          ref: 36bd05eeebd101064175f33726934ead35515b4b
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Run strict isolated candidate or current-main landing checks
        working-directory: controller
        env:
          AUDIT_MODE: ${{ matrix.mode }}
        run: |
          mkdir -p "$RUNNER_TEMP/36bd-evidence"
          cp docs/reviews/36bd05ee-independent/pin.json "$RUNNER_TEMP/36bd-evidence/pin.json"
          PYTHONPATH=. python3 docs/reviews/36bd05ee-independent/run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: 36bd-${{ matrix.mode }}
          path: ${{ runner.temp }}/36bd-evidence/
          retention-days: 14
