[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hackatl-shared"
version = "0.1.0"
description = "Canonical cross-subsystem contracts (Pydantic v2) with generated JSON Schema and TypeScript"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "hackatl-standards"]

[tool.uv.sources]
hackatl-standards = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["shared"]
