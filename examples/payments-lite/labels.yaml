# Ground-truth labels for evaluating the platform on payments-lite (answer key).
# Kept OUTSIDE target/ on purpose: the platform must index and build only target/,
# so it finds these from intent, tests and conventions, not from labels.
# Class-level descriptions only (docs/15): what invariant is broken, not attack steps.
target_dir: target
schema_version: 1
expectations:
  - id: exp_owner_only
    subject: "GET /payments/{payment_id}"
    statement: "A customer can only read payments they own."
    kind: authorization
    data_sensitivity: financial
    sources:
      - {path: target/payments_lite/app.py, symbol: create_app, note: "module docstring: own profile, payments and refunds"}
      - {path: target/payments_lite/app.py, symbol: require_owner, note: "used by every sibling resource route"}
      - {path: target/README.md, note: "Behavior section"}
  - id: exp_refund_bound
    subject: "POST /refunds"
    statement: "Total refunds for a payment must never exceed the payment's original amount."
    kind: invariant
    data_sensitivity: financial
    sources:
      - {path: target/payments_lite/app.py, symbol: create_refund, note: docstring}
      - {path: target/README.md, note: "Behavior section"}
planted_findings:
  - id: fnd_planted_authz
    kind: security
    weakness_class: CWE-639  # authorization bypass through user-controlled key
    subject: "GET /payments/{payment_id}"
    violated_expectation: exp_owner_only
    root_cause_span: {path: target/payments_lite/app.py, symbol: get_payment, note: "no require_owner call"}
    expected_check_category: access_control.ownership
    severity_expected: high
  - id: fnd_planted_refund_bound
    kind: functional
    weakness_class: CWE-840  # business logic error
    subject: "POST /refunds"
    violated_expectation: exp_refund_bound
    root_cause_span: {path: target/payments_lite/app.py, symbol: create_refund, note: "compares only the new refund with the payment amount"}
    expected_check_category: input_validation.bounds
    severity_expected: medium
negatives:
  # Lookalikes that must be REFUTED (precision check).
  - {subject: "GET /customers/{customer_id}", hypothesis_class: CWE-639}
  - {subject: "GET /refunds/{refund_id}", hypothesis_class: CWE-639}
  - {subject: "POST /refunds", hypothesis_class: CWE-639, note: "ownership is checked; only the amount bound is wrong"}
fixture_identities:
  - {customer: cus_alice, token: fixture-token-alice, owns: [pay_a1, pay_a2]}
  - {customer: cus_bob, token: fixture-token-bob, owns: [pay_b1]}
rl_topology: ../../rl-defense/configs/topology/payments_lite.yaml
