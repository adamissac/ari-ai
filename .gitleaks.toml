# gitleaks config (INFRA-003). Extends the built-in rules.
title = "hackatl-agentic-security"

[extend]
useDefault = true

# The default Anthropic rule only matches standard key prefixes. Catch every
# sk-ant-<kind>-<token> form, including the user-scoped keys this team uses.
[[rules]]
id = "anthropic-any-key"
description = "Anthropic API key (any sk-ant-* form)"
regex = '''sk-ant-[a-z0-9]{2,8}-[A-Za-z0-9_\-]{40,}'''
keywords = ["sk-ant-"]

[[allowlists]]
description = "Documented placeholders and synthetic fixtures"
paths = ['''\.env\.example$''']
regexes = ['''fixture-token-(alice|bob)''', '''replace-me''']

# Pinned upstream git commit SHAs (e.g. OWASP_API_COMMIT in standards/scripts) are
# public identifiers, not credentials; generic-api-key fires on the "API" in the name.
# Line-targeted and exact: only a 40-hex value assigned to a *_COMMIT name.
[[allowlists]]
description = "Pinned upstream commit SHAs"
regexTarget = "line"
regexes = ['''^\s*[A-Z][A-Z0-9_]*_COMMIT\s*=\s*"[0-9a-f]{40}"\s*$''']
