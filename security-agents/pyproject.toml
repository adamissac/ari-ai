[project]
name = "security-agents"
version = "0.1.0"
description = "Pillar 2: seven runtime security agents, orchestrator, tool registry and sandbox"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "anthropic>=1.15",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "fastapi>=0.115"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["security_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../examples/payments-lite"]
markers = [
  "live: requires RUN_LIVE_LLM_EVAL=1 and an authorized Anthropic key",
  "boundary: security-boundary suite (release blocking)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
packages = ["security_agents"]
warn_unused_ignores = false
ignore_missing_imports = true
