name: code-review

on:
  pull_request:
    paths: ["code-review/**", "shared/**", "backend/**", "code-intelligence/**", "security-agents/security_agents/sandbox/**", "examples/payments-lite/**", "pyproject.toml", "uv.lock", ".github/workflows/code-review.yml"]
  push:
    branches: [main]
    paths: ["code-review/**", "shared/**", "backend/**", "code-intelligence/**", "security-agents/security_agents/sandbox/**", "examples/payments-lite/**", "pyproject.toml", "uv.lock", ".github/workflows/code-review.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 2s
          --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci-only@localhost:5432/postgres
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        run: python3 -m pip install --user "uv==0.11.28"
      - name: Install locked workspace
        run: ~/.local/bin/uv sync --frozen
      - name: Lint, format and strict types
        run: |
          ~/.local/bin/uv run ruff check code-review
          ~/.local/bin/uv run ruff format --check code-review
          ~/.local/bin/uv run mypy --config-file code-review/pyproject.toml code-review/code_review
      - name: Reviewer suite (FakeTransport; real git, pytest and PostgreSQL; no live key)
        run: ~/.local/bin/uv run pytest -ra code-review/tests
      - name: Reviewer through the shared security_agents sandbox driver
        run: |
          ~/.local/bin/uv pip install -e security-agents --no-deps
          ~/.local/bin/uv run --no-sync pytest -ra code-review/tests/test_shared_sandbox.py
