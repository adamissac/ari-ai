name: read-only research bounds
on:
  pull_request:
    paths: ["scripts/research/resource_bounds.py", "tests/research/**", "docs/research/rl-product-thesis/**", ".github/workflows/research-bounds.yml"]
  push:
    branches: [main]
    paths: ["scripts/research/resource_bounds.py", "tests/research/**", "docs/research/rl-product-thesis/**", ".github/workflows/research-bounds.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - name: Install analytical test tools only
        run: |
          uv venv --python 3.12 .venv-audit
          uv pip install --python .venv-audit/bin/python pytest==9.1.1 ruff==0.17.2
      - name: Lint and read-only mathematical/provenance tests
        run: |
          .venv-audit/bin/ruff check scripts/research/resource_bounds.py tests/research/test_resource_bounds.py
          .venv-audit/bin/ruff format --check scripts/research/resource_bounds.py tests/research/test_resource_bounds.py
          .venv-audit/bin/python -m pytest tests/research/test_resource_bounds.py -q
