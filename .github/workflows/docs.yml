name: docs

on:
  pull_request:
    paths: ["**/*.md", "scripts/check_links.py", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["**/*.md", "scripts/check_links.py", ".github/workflows/docs.yml"]

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Internal links, anchors and Mermaid block types
        run: python3 -I scripts/check_links.py
