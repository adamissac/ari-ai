name: containers
on:
  pull_request:
    paths: ["backend/Dockerfile", ".dockerignore", "docker-compose.yml", ".env.example", "pyproject.toml", "uv.lock", "shared/**", "backend/**", "code-intelligence/**", "code-review/**", "security-agents/**", "standards/**", "tests/packaging/**", ".github/workflows/containers.yml"]
  push:
    branches: [main]
    paths: ["backend/Dockerfile", ".dockerignore", "docker-compose.yml", ".env.example", "pyproject.toml", "uv.lock", "shared/**", "backend/**", "code-intelligence/**", "code-review/**", "security-agents/**", "standards/**", "tests/packaging/**", ".github/workflows/containers.yml"]
permissions:
  contents: read
jobs:
  backend-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned uv
        run: python3 -m pip install --user "uv==0.11.28"
      - name: Verify build inputs
        run: |
          ~/.local/bin/uv sync --frozen
          ~/.local/bin/uv run pytest -ra tests/packaging
      - name: Build actual control-plane image
        run: docker build -f backend/Dockerfile -t hackatl-backend:ci .
      - name: Non-root imports without network, credentials or a database
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp
          hackatl-backend:ci python -c
          "import os, importlib; assert os.getuid() != 0; [importlib.import_module(m) for m in ('shared', 'backend.main', 'monitoring.api', 'code_intelligence.api', 'code_review.api', 'security_agents.api')]; print('all runtime packages imported as non-root')"

  compose-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned uv
        run: python3 -m pip install --user "uv==0.11.28"
      - name: Local-only .env from the documented template
        run: |
          cp .env.example .env
          sed -i "s/^GITHUB_WEBHOOK_SECRET=.*/GITHUB_WEBHOOK_SECRET=ci-compose-smoke/; s/^SESSION_SECRET=.*/SESSION_SECRET=$(openssl rand -hex 32)/" .env
      - name: Start db, migrate, api, worker
        run: docker compose up -d --build --wait
      - name: Readiness reports database, queue and webhook secret
        run: >-
          curl -fsS http://localhost:8000/readyz | python3 -c
          "import json, sys; d = json.load(sys.stdin); print(d); assert d['database'] and d['queue'] and d['webhook_secret_configured'], d"
      - name: Signed webhook is verified, persisted and enqueued
        run: |
          ~/.local/bin/uv sync --frozen
          GITHUB_WEBHOOK_SECRET=ci-compose-smoke ~/.local/bin/uv run python -m backend.replay_webhook \
            --api http://localhost:8000 --repo acme/payments-lite \
            --head 1111111111111111111111111111111111111111 --path app/payments.py
      - name: Compose logs
        if: always()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
