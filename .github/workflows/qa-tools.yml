name: qa-tools
on:
  pull_request:
    paths: ["scripts/devin_qa/**", "tests/qa/**", ".github/workflows/qa-tools.yml"]
  push:
    branches: [main]
    paths: ["scripts/devin_qa/**", "tests/qa/**", ".github/workflows/qa-tools.yml"]
permissions:
  contents: read
jobs:
  runner-semantics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 -m unittest discover -s tests/qa -v
