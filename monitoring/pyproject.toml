[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hackatl-monitoring"
version = "0.1.0"
description = "Event normalization, impact correlation and reassessment trigger policy (pure logic, no I/O)"
requires-python = ">=3.12"
dependencies = ["hackatl-shared"]

[tool.uv.sources]
hackatl-shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["monitoring"]
